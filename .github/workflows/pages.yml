name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'apps-script/Pacing.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the shared pace rule
        run: node --test tests/*.test.js
      - name: Build (shared pace rule + service-worker build stamp)
        run: |
          cp apps-script/Pacing.js web/js/pacing.js
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
